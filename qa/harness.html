<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기억 서재 QA</title>
<link rel="icon" href="data:,">
<style>
/* Stand-ins for Lumiverse 1.2.5: the ViewportDrawer (frontend/src/components/panels/ViewportDrawer.module.css) and the input bar
   Extras menu. Static defaults from frontend/src/theme/variables.css; the theme engine overrides most of them per theme
   (qa/host-themes.json via qa.setTheme) but never --lumiverse-bg-opaque / --lumiverse-card-bg-solid. */
:root{--lumiverse-bg:rgba(28,24,38,.95);--lumiverse-bg-opaque:rgb(28 24 38);--lumiverse-card-bg-solid:rgb(24,20,34);--lumiverse-bg-elevated:rgba(35,30,48,.9);--lumiverse-bg-deep:rgba(10,8,18,1);--lumiverse-text:rgba(255,255,255,.9);--lumiverse-text-muted:rgba(255,255,255,.65);--lumiverse-text-dim:rgba(255,255,255,.4);--lumiverse-border:rgba(147,112,219,.12);--lumiverse-border-neutral:rgba(128,128,128,.15);--lumiverse-primary:rgba(147,112,219,.9);--lumiverse-primary-contrast:#fff;--lumiverse-danger:#ef4444;--lumiverse-shadow-lg:0 8px 24px #0006}
html,body{margin:0;height:100%;background:var(--lumiverse-bg-deep);color:var(--lumiverse-text);font-family:system-ui,sans-serif}
.chat{position:fixed;inset:0;padding:16px;color:#888;overflow:hidden}
.composer{position:absolute;left:12px;right:12px;bottom:12px;min-height:48px;border:1px solid #666;border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 12px}
.composer .extras{margin-left:auto;min-width:44px;min-height:44px}
#extras-menu{position:absolute;right:12px;bottom:64px;background:var(--lumiverse-bg-elevated);border:1px solid var(--lumiverse-border);border-radius:10px;display:none;flex-direction:column;min-width:180px;z-index:50}
#extras-menu.on{display:flex}
#extras-menu button{min-height:44px;text-align:left;background:none;border:0;color:var(--lumiverse-text);padding:0 12px;font-size:15px}
.wrapper{position:fixed;top:0;right:0;bottom:0;display:none;z-index:10}
.wrapper.on{display:flex}
.drawer{display:flex;height:100%;width:480px;background:var(--lumiverse-bg);box-shadow:0 0 24px #0008}
.sidebar{width:64px;flex:none;border-right:1px solid var(--lumiverse-border-neutral);display:flex;flex-direction:column}
.sidebar button{min-height:56px;background:none;border:0;color:var(--lumiverse-text);font-size:13px}
.sidebar button.on{background:var(--lumiverse-primary)}
.panel{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.header{min-height:48px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--lumiverse-border-neutral);font-weight:600}
.panelContent{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;padding:12px 12px 0;position:relative}
.panelContent>div{display:none}.panelContent>div.on{display:block}
@media (max-width:600px){.drawer{width:100vw;flex-direction:column}.sidebar{width:100%;height:58px;flex-direction:row;border-right:0;border-bottom:1px solid var(--lumiverse-border-neutral)}.sidebar button{flex:1}}
#toasts{position:fixed;left:12px;bottom:80px;z-index:20000;display:flex;flex-direction:column;gap:6px}
#toasts div{background:var(--lumiverse-bg-elevated);border:1px solid var(--lumiverse-border);padding:8px 12px;border-radius:8px;font-size:15px}
</style>
</head>
<body>
<div class="chat">본편 채팅 화면 (QA 대역)
  <div class="composer">입력창<button class="extras" id="extras-btn" aria-label="더보기">＋</button></div>
  <div id="extras-menu"></div>
</div>
<div class="wrapper" id="drawer"><div class="drawer"><div class="sidebar" id="sidebar"></div><div class="panel"><div class="header" id="drawer-title">드로어</div><div class="panelContent" id="panelContent"></div></div></div></div>
<div id="toasts"></div>
<script type="module" src="./harness.js"></script>
</body>
</html>
